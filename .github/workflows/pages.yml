name: Deploy homepage mockup
on:
  push:
    branches: [main]
    paths: ['site/**', 'scripts/check-design-files.py', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate JavaScript
        run: |
          node --check site/app.js
          node --check site/proposal.js
          node --check site/designs/shared.js
          node --check site/designs/proposal.js
          node --check site/preview/gallery.js
          python3 scripts/check-design-files.py
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload website only
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Wait for the Pages artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in {1..12}; do
            count=$(gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts" --jq '[.artifacts[] | select(.name == "github-pages" and .expired == false)] | length')
            if [ "$count" = "1" ]; then exit 0; fi
            sleep 5
          done
          echo "Pages artifact did not become available" >&2
          exit 1
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
